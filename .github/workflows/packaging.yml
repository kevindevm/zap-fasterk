name: Packaging

on:
  push:
    branches: [main, master]
    paths: [native-packages.yaml, packaging/windows/**, .github/workflows/packaging.yml, .github/workflows/release.yml]
  pull_request:
    paths: [native-packages.yaml, packaging/windows/**, .github/workflows/packaging.yml, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Published Zap Fasterk version (required for package builds)
        type: string
        default: ''
      publish:
        description: Attach packages and run enabled downstream publishers
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish:
        type: boolean
        default: true
    secrets:
      AUR_SSH_KEY:
        required: false
      AUR_KNOWN_HOSTS:
        required: false
      HOMEBREW_TAP_GITHUB_TOKEN:
        required: false
      HOMEBREW_TAP_SSH_KEY:
        required: false

permissions:
  contents: read

jobs:
  # The Windows package, installed for real with stand-in program files: an
  # Inno Setup install as earlier releases made, the MSI taking it over, an
  # update, and uninstalling with Zap Fasterk running and without. Releases
  # ship only the MSI; the Inno script stays to make the old install to take
  # over.
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install, update and remove
        shell: pwsh
        run: pwsh packaging/windows/test-installer.ps1
      # The release's own path to the package: native-packages checks the
      # input's executable is an x64 PE file, so a system one stands in.
      - name: Package as the release does
        shell: pwsh
        run: |
          gem install native-packages --version 0.9.0 --no-document
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $payload = "dist\windows-input-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item "$env:SystemRoot\System32\PING.EXE" "$payload\zap-fasterk.exe"
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md, packaging\windows\zap-fasterk-installer.txt $payload
          native-packages build --version 0.0.1 --target windows-amd64 `
            --defer-recipes --output "$env:RUNNER_TEMP\windows-packages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "$env:RUNNER_TEMP\windows-packages\packages\windows-amd64\msi\zap-fasterk-v0.0.1-x86_64-pc-windows-msvc.msi"
