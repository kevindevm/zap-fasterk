name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CXXFLAGS_aarch64_pc_windows_msvc: /EHsc
  # Baked into the binary by settings.rs; releases built without the
  # secret simply ship keyless and the picker asks for one.
  ZAPFAST_GIPHY_KEY: ${{ secrets.ZAPFAST_GIPHY_KEY || secrets.FASTSAPP_GIPHY_KEY }}

jobs:
  release-source:
    name: tag is on main
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the release commit on main
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tags must point to a commit already on origin/main." >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: release-source
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Cross-compiled from x64: the MSVC arm64 linker ships with the
          # runner's Visual Studio.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - name: Check release version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The repository pins its toolchain; add the cross-target's standard
      # library to the toolchain the pin actually resolves to.
      - run: rustup target add ${{ matrix.target }}
      - name: Configure Windows ARM compiler
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          # Keep the MSVC ABI while compiling native code with the hosted
          # LLVM toolchain.
          echo CMAKE_GENERATOR=Ninja >> "$GITHUB_ENV"
          echo CC_aarch64_pc_windows_msvc=clang-cl >> "$GITHUB_ENV"
          echo CXX_aarch64_pc_windows_msvc=clang-cl >> "$GITHUB_ENV"
      # No compiler cache: published binaries never build from outputs
      # restored from an Actions cache.
      - run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="zap-fasterk-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/zap-fasterk.exe" "dist/$name/"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md packaging/zap-fasterk-portable.txt "dist/$name/"
          cd dist
          7z a "$name.zip" "$name"

      # The Windows installer: a per-user Windows Installer package, which also
      # takes over a copy the Inno Setup program of earlier releases installed
      # (PACKAGING.md, "Windows installer"). The Inno script stays only so
      # test-installer.ps1 can make an Inno install for the package to take
      # over; releases no longer ship the setup program.
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '4.0'
      - name: Windows Installer package
        shell: pwsh
        run: |
          gem install native-packages --version 0.9.0 --no-document
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:Path += ";$env:USERPROFILE\.dotnet\tools"
          $target = "${{ matrix.target }}"
          $payload = "dist\windows-input-$target"
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item "target\$target\release\zap-fasterk.exe", README.md, LICENSE, THIRD-PARTY-NOTICES.md, `
            packaging\windows\zap-fasterk-installer.txt $payload
          $packageTarget = if ($target.StartsWith("aarch64")) { "windows-arm64" } else { "windows-amd64" }
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          native-packages build --version $version --target $packageTarget `
            --defer-recipes --output "$env:RUNNER_TEMP\windows-packages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP\windows-packages\packages\$packageTarget\msi\*.msi" dist\
          $resolvedPayload = [IO.Path]::GetFullPath($payload)
          $expectedPayload = [IO.Path]::GetFullPath("$PWD\dist\windows-input-$target")
          if ($resolvedPayload -ne $expectedPayload) { throw "Unexpected installer payload path" }
          Remove-Item -LiteralPath $resolvedPayload -Recurse

      - name: Attest release packages
        uses: crmne/native-packages/.github/actions/attest@83bd46c245488c2b8f1b9d74569e16cf6a449e8f # v0.9.0
        with:
          subject-path: |
            dist/*.zip
            dist/*.msi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [build]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require successful CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 180); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=10" \
              --jq '.workflow_runs[0] | if . == null then "missing" else .status + ":" + (.conclusion // "") end')
            echo "CI for $GITHUB_SHA: $state"
            case "$state" in
              completed:success) exit 0 ;;
              completed:*) echo "Release source CI did not pass." >&2; exit 1 ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for release source CI." >&2
          exit 1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '4.0'
      - name: Sign update manifest
        uses: crmne/native-packages/.github/actions/sign-release@83bd46c245488c2b8f1b9d74569e16cf6a449e8f # v0.9.0
        with:
          directory: dist
          public-key: assets/update-public-key.hex
          key-env: ZAPFASTER_UPDATE_SIGNING_KEY
        env:
          ZAPFASTER_UPDATE_SIGNING_KEY: ${{ secrets.ZAPFASTER_UPDATE_SIGNING_KEY }}
      # Publish the reviewed notes committed before the tag, never a
      # generated summary. A stable tag without them stops here; a
      # prerelease without them gets a short placeholder.
      - name: Release notes
        run: |
          notes="packaging/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "Prerelease build of Zap Fasterk ${GITHUB_REF_NAME}." > release-notes.md
          else
            echo "::error::Write $notes and push it before tagging a stable release."
            exit 1
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          name: Zap Fasterk ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
          draft: ${{ contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  packaging:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: publish
    uses: ./.github/workflows/packaging.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
