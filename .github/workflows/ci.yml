name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Native C++ code (openh264) needs exceptions on Windows ARM64.
  # clang-cl leaves C++ exceptions off unless they are requested explicitly.
  CXXFLAGS_aarch64_pc_windows_msvc: /EHsc

jobs:
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - name: Audit all locked dependencies
        run: cargo audit

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev cmake perl libclang-dev
      # After the toolchain, so the cache key follows the pinned rustc. The
      # key carries no job name, so each job sets its own generation. Saves
      # only on pushes to main; pull requests restore.
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: quality-v1
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy (default features)
        run: mbx clippy --locked --all-targets -- -D warnings
      - name: Clippy (all features)
        run: mbx clippy --locked --all-targets --all-features -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: mbx doc --locked --all-features --no-deps

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libasound2-dev cmake perl libclang-dev xvfb xauth libgl1-mesa-dri libegl1
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: test-v1
      # The demo feature carries the headless layout test of every screen.
      - name: Tests (default features)
        run: mbx test --locked --all-targets
      - name: Tests (all features)
        run: mbx test --locked --all-targets --all-features
      - name: Build macOS demo
        if: runner.os == 'macOS'
        run: mbx build --locked --features demo
      - name: macOS window smoke test
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          target/debug/zap-fasterk --demo --demo-shot "$RUNNER_TEMP/zap-fasterk-content.png" --demo-shot-delay 8000 &
          demo_pid=$!
          sleep 6
          screencapture -x "$RUNNER_TEMP/zap-fasterk-window.png" || true
          wait "$demo_pid"
          test -s "$RUNNER_TEMP/zap-fasterk-content.png"
          for page in media-album forward-review voice-transcript starred star-menu pinned background-history original-documents international-sender; do
            target/debug/zap-fasterk --demo --demo-page "$page" --demo-shot "$RUNNER_TEMP/zap-fasterk-$page.png" --demo-shot-delay 1200
            test -s "$RUNNER_TEMP/zap-fasterk-$page.png"
          done
      - name: macOS preview
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-preview
          path: ${{ runner.temp }}/zap-fasterk-*.png
      - name: Build Linux demo
        if: runner.os == 'Linux'
        run: mbx build --locked --features demo
      - name: Linux native window smoke test
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          XDG_RUNTIME_DIR: ${{ runner.temp }}/zap-fasterk-demo-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          for page in media-album forward-review voice-transcript starred star-menu pinned background-history original-documents international-sender; do
            timeout 45s xvfb-run -a -s "-screen 0 1600x1200x24" \
              env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET \
              target/debug/zap-fasterk --demo --demo-page "$page" \
              --demo-shot "$RUNNER_TEMP/zap-fasterk-$page.png" --demo-shot-delay 2500 \
              > "$RUNNER_TEMP/zap-fasterk-$page.log" 2>&1
            test -s "$RUNNER_TEMP/zap-fasterk-$page.png"
          done
      - name: Linux preview
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-preview
          path: |
            ${{ runner.temp }}/zap-fasterk-*.png
            ${{ runner.temp }}/zap-fasterk-*.log

  windows-arm64:
    name: compile (Windows arm64)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # The hosted Windows image includes LLVM and Ninja, so compile native
      # C++ code with clang-cl while retaining the MSVC ABI expected by
      # Rust's aarch64-pc-windows-msvc target.
      CMAKE_GENERATOR: Ninja
      CC_aarch64_pc_windows_msvc: clang-cl
      CXX_aarch64_pc_windows_msvc: clang-cl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - run: rustup target add aarch64-pc-windows-msvc
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: windows-arm64-v1
      - run: mbx check --locked --all-targets --all-features --target aarch64-pc-windows-msvc

  nix:
    name: Nix package (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    # The macOS cold build exceeded the former 90-minute job limit.
    # Keep a finite limit and show builder output so slow steps are diagnosable.
    timeout-minutes: ${{ matrix.system == 'aarch64-darwin' && 120 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v7
      # Frees disk space on Ubuntu runners; macOS runners have enough.
      - uses: wimpysworld/nothing-but-nix@v9
        if: runner.os == 'Linux'
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-
      - name: Check flake outputs
        run: nix flake check --no-build
      - name: Build package
        run: nix build --print-build-logs .#default
