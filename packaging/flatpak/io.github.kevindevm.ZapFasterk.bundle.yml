# The release workflow's Flatpak: the binary the Linux job built, packaged
# into the same sandbox as io.github.kevindevm.ZapFasterk.yml describes. The
# job unpacks the release tarball into built/ beside this file first.
id: io.github.kevindevm.ZapFasterk
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: zap-fasterk
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  # Archive encryption key.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --persist=.local/state
modules:
  - name: zap-fasterk
    buildsystem: simple
    build-commands:
      - install -Dm755 zap-fasterk /app/bin/zap-fasterk
      - install -Dm644 packaging/applications/*.desktop /app/share/applications/io.github.kevindevm.ZapFasterk.desktop
      - sed -i 's/^Icon=.*$/Icon=io.github.kevindevm.ZapFasterk/;s/^StartupWMClass=zap-fasterk$/StartupWMClass=io.github.kevindevm.ZapFasterk/' /app/share/applications/io.github.kevindevm.ZapFasterk.desktop
      - install -Dm644 packaging/icons/zap-fasterk.svg /app/share/icons/hicolor/scalable/apps/io.github.kevindevm.ZapFasterk.svg
      - install -Dm644 packaging/flatpak/io.github.kevindevm.ZapFasterk.metainfo.xml /app/share/metainfo/io.github.kevindevm.ZapFasterk.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/zap-fasterk/LICENSE
    sources:
      - type: dir
        path: built
      # Metainfo belongs to this packaging checkout, not the portable archive.
      - type: file
        path: io.github.kevindevm.ZapFasterk.metainfo.xml
        dest: packaging/flatpak
