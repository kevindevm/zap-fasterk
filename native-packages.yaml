# Shared CLI: gem install native-packages --version 0.9.0
---
schema: 1
tool:
  version: 0.9.0
  nfpm: 2.47.0
# Ubuntu 22.04 build ABI also works with the t64 package's Provides alias.
libraries:
  libasound.so.2:
    deb: libasound2
    rpm: alsa-lib
nfpm:
  name: zap-fasterk
  maintainer: kevindevm
  homepage: https://github.com/kevindevm/zap-fasterk
  description: Fast native WhatsApp client
  license: MIT
  provides: [zap-fasterk]
  conflicts: [zapfasterk, fastsapp]
  replaces: []
  contents:
  - src: "@PAYLOAD@/zap-fasterk-v@VERSION@-@TARGET@/zap-fasterk"
    dst: "/usr/bin/zap-fasterk"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/zap-fasterk-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/zap-fasterk/LICENSE"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zap-fasterk-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/zap-fasterk/README.md"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zap-fasterk-v@VERSION@-@TARGET@/packaging/applications/zap-fasterk.desktop"
    dst: "/usr/share/applications/zap-fasterk.desktop"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zap-fasterk-v@VERSION@-@TARGET@/packaging/icons/zap-fasterk.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/zap-fasterk.svg"
    file_info:
      mode: 420
  - src: contrib/omarchy/zap-fasterk.json.tpl
    dst: /usr/share/zap-fasterk/omarchy/zap-fasterk.json.tpl
    file_info:
      mode: 420
  - src: contrib/omarchy/zap-fasterk-theme
    dst: /usr/share/zap-fasterk/omarchy/zap-fasterk-theme
    file_info:
      mode: 493
  overrides:
    deb:
      depends:
      - libc6 (>= 2.35)
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2
      - libasound2-plugins
      - libgcc-s1
      - libstdc++6
    rpm:
      depends:
      - glibc >= 2.35
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - alsa-plugins-pulseaudio
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'zap-fasterk-@TAG@-macos-universal.dmg'
  windows-amd64:
    platform: windows
    arch: amd64
    formats: [msi]
    input:
      kind: directory
      local: dist/windows-input-x86_64-pc-windows-msvc
    native:
      command: [ruby, packaging/windows/msi.rb, '@PAYLOAD@', '@PACKAGE@', '@VERSION@']
      output: 'zap-fasterk-@TAG@-x86_64-pc-windows-msvc.msi'
  windows-arm64:
    platform: windows
    arch: arm64
    formats: [msi]
    input:
      kind: directory
      local: dist/windows-input-aarch64-pc-windows-msvc
    native:
      command: [ruby, packaging/windows/msi.rb, '@PAYLOAD@', '@PACKAGE@', '@VERSION@']
      output: 'zap-fasterk-@TAG@-aarch64-pc-windows-msvc.msi'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    after_package: [python3, packaging/linux-finalize.py, '@FORMAT@', '@PACKAGE@', '@PAYLOAD@/zap-fasterk-v@VERSION@-@TARGET@/zap-fasterk', '@ARCH@']
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/zap-fasterk-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: zap-fasterk-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    after_package: [python3, packaging/linux-finalize.py, '@FORMAT@', '@PACKAGE@', '@PAYLOAD@/zap-fasterk-v@VERSION@-@TARGET@/zap-fasterk', '@ARCH@']
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/zap-fasterk-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: zap-fasterk-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
release:
  repository: kevindevm/zap-fasterk
  checksums: checksums.txt
  prereleases: true
assets:
  AMD64:
    file: zap-fasterk-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/zap-fasterk-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: zap-fasterk-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/zap-fasterk-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  MACOS:
    file: zap-fasterk-v@VERSION@-macos-universal.dmg
    local: dist/zap-fasterk-v@VERSION@-macos-universal.dmg
  SOURCE:
    file: zap-fasterk-@VERSION@.tar.gz
    url: https://github.com/kevindevm/zap-fasterk/archive/refs/tags/v@VERSION@.tar.gz
    checksummed: false
    local: dist/zap-fasterk-@VERSION@.tar.gz
templates:
  homebrew/zap-fasterk.rb: packaging/homebrew/zap-fasterk.rb.in
  arch/zap-fasterk/PKGBUILD: packaging/arch/zap-fasterk/PKGBUILD.in
  arch/zap-fasterk/zap-fasterk.install: packaging/arch/zap-fasterk.install
  arch/zap-fasterk-bin/PKGBUILD: packaging/arch/zap-fasterk-bin/PKGBUILD.in
  arch/zap-fasterk-bin/zap-fasterk-bin.install: packaging/arch/zap-fasterk.install
  arch/zap-fasterk-git/PKGBUILD: packaging/arch/zap-fasterk-git/PKGBUILD.in
  arch/zap-fasterk-git/zap-fasterk-git.install: packaging/arch/zap-fasterk.install
version_file: Cargo.toml
