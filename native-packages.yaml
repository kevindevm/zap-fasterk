# Shared CLI: gem install native-packages --version 0.9.0
---
schema: 1
tool:
  version: 0.9.0
targets:
  windows-amd64:
    platform: windows
    arch: amd64
    formats: [msi]
    input:
      kind: directory
      local: dist/windows-input-x86_64-pc-windows-msvc
    native:
      command: [ruby, packaging/windows/msi.rb, '@PAYLOAD@', '@PACKAGE@', '@VERSION@']
      output: 'zap-fasterk-@TAG@-x86_64-pc-windows-msvc.msi'
  windows-arm64:
    platform: windows
    arch: arm64
    formats: [msi]
    input:
      kind: directory
      local: dist/windows-input-aarch64-pc-windows-msvc
    native:
      command: [ruby, packaging/windows/msi.rb, '@PAYLOAD@', '@PACKAGE@', '@VERSION@']
      output: 'zap-fasterk-@TAG@-aarch64-pc-windows-msvc.msi'
release:
  repository: kevindevm/zap-fasterk
  checksums: checksums.txt
  prereleases: true
assets:
  SOURCE:
    file: zap-fasterk-@VERSION@.tar.gz
    url: https://github.com/kevindevm/zap-fasterk/archive/refs/tags/v@VERSION@.tar.gz
    checksummed: false
    local: dist/zap-fasterk-@VERSION@.tar.gz
templates: {}
version_file: Cargo.toml
